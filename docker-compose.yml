services:
  db:
    image: postgres:16-alpine
    container_name: smartfarm-db
    environment:
      POSTGRES_USER: smartfarm
      POSTGRES_PASSWORD: smartfarm
      POSTGRES_DB: smartfarm
    ports:
      - "5432:5432"
    volumes:
      - smartfarm-db:/var/lib/postgresql/data
volumes:
  smartfarm-db:
